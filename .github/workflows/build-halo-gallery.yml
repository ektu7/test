name: Build Halo Gallery 3 and Video 3
on:
  push:
    branches: [halo-gallery-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build two standalone apps
        run: gradle --no-daemon -p HaloGallery :app:assembleGalleryDebug :app:assembleVideoDebug --stacktrace
      - name: Validate signing and Android package names
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose HaloGallery/app/build/outputs/apk/gallery/debug/app-gallery-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose HaloGallery/app/build/outputs/apk/video/debug/app-video-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging HaloGallery/app/build/outputs/apk/gallery/debug/app-gallery-debug.apk | head -n 5
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging HaloGallery/app/build/outputs/apk/video/debug/app-video-debug.apk | head -n 5
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Gallery-v3-APK
          path: HaloGallery/app/build/outputs/apk/gallery/debug/app-gallery-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Video-v3-APK
          path: HaloGallery/app/build/outputs/apk/video/debug/app-video-debug.apk
          if-no-files-found: error
