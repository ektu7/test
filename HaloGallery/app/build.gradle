plugins {
    id 'com.android.application'
}

android {
    namespace 'com.halogallery.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.halogallery.offline'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
// Intentionally no external libraries, analytics, ads, network or third-party SDKs.
