name: Build and Test Halo Gallery APK
on:
  push:
    branches: [halo-gallery-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: gradle --no-daemon -p HaloGallery assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HaloGallery-installable-debug-apk
          path: HaloGallery/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify app launches on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r HaloGallery/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.halogallery.offline android.permission.READ_MEDIA_IMAGES
            adb shell pm grant com.halogallery.offline android.permission.READ_MEDIA_VIDEO
            adb shell am start -W -n com.halogallery.offline/.MainActivity
            sleep 5
            adb logcat -d -s AndroidRuntime:E ActivityTaskManager:E > halogallery-emulator-log.txt
            cat halogallery-emulator-log.txt
            adb shell pidof com.halogallery.offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HaloGallery-test-log
          path: halogallery-emulator-log.txt
          if-no-files-found: ignore
