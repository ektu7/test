plugins {
    id 'com.android.application'
}

android {
    namespace 'com.halogallery.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.halogallery'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '2.1.0'
    }
    flavorDimensions 'experience'
    productFlavors {
        gallery {
            dimension 'experience'
            applicationIdSuffix '.gallery'
            resValue 'string', 'app_name', 'Halo Gallery'
        }
        video {
            dimension 'experience'
            applicationIdSuffix '.video'
            resValue 'string', 'app_name', 'Halo Video'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
// Intentionally no external libraries, analytics, ads, network or third-party SDKs.
