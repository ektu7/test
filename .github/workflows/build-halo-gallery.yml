name: Build Halo Gallery APK
on:
  push:
    branches: [halo-gallery-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        run: gradle --no-daemon -p HaloGallery --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HaloGallery-installable-debug-apk
          path: HaloGallery/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
